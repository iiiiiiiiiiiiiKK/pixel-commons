name: Deploy

# Manual, opt-in deployment. Nothing here runs with your credentials unless you
# add them as repository secrets:
#
#   CLOUDFLARE_API_TOKEN     Workers Scripts:Edit + Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID
#   SESSION_SECRET           random 32-byte base64url string
#   ADMIN_TOKEN              optional, enables the admin console
#
# Set them in Settings → Secrets and variables → Actions.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        required: true
        default: worker
        type: choice
        options:
          - worker
          - worker-and-pages
          - github-pages

jobs:
  worker:
    if: inputs.target == 'worker' || inputs.target == 'worker-and-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Push runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
          if [ -n "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN
          fi

      - name: Deploy Worker + Durable Object
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Deploy Pages project
        if: inputs.target == 'worker-and-pages'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pixel-commons --branch=main

  github-pages:
    if: inputs.target == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static demo pointing at the API
        env:
          VITE_API_BASE: ${{ vars.PAGES_API_BASE }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "Set the repository variable PAGES_API_BASE (e.g. https://pixel-commons.pages.dev) first."
            exit 1
          fi
          npx vite build --outDir dist-pages --emptyOutDir
          cp dist-pages/index.html dist-pages/404.html

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          publish_branch: gh-pages
